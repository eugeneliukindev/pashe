<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="pashe">
  <!-- Line art: the body is a wide blue stroke under a narrower white one, so it reads as an outlined tube. -->
  <defs>
    <g id="cube" stroke="#e09200" stroke-width="4" stroke-linejoin="round">
      <polygon points="0,-24 20.8,-12 0,0 -20.8,-12" fill="#ffe680"/>
      <polygon points="-20.8,-12 0,0 0,24 -20.8,12" fill="#ffffff"/>
      <polygon points="0,0 20.8,-12 20.8,12 0,24" fill="#ffffff"/>
    </g>
  </defs>

  <rect width="256" height="256" fill="#ffffff"/>

  <g fill="none" stroke-linecap="round">
    <path id="body" d="M166 133 Q148 130 128 131 A80 34 0 0 0 48 165 A80 34 0 0 0 208 165 C210 140 212 122 198 108" stroke="#2f6fd0" stroke-width="26"/>
    <path d="M166 133 Q148 130 128 131 A80 34 0 0 0 48 165 A80 34 0 0 0 208 165 C210 140 212 122 198 108" stroke="#ffffff" stroke-width="16"/>
  </g>

  <g fill="#ffd84d">
    <circle cx="70" cy="187" r="3"/>
    <circle cx="104" cy="197" r="3"/>
    <circle cx="140" cy="199" r="3"/>
    <circle cx="176" cy="192" r="3"/>
    <circle cx="210" cy="140" r="3"/>
  </g>

  <use href="#cube" x="107" y="144"/>
  <use href="#cube" x="149" y="144"/>
  <use href="#cube" x="128" y="156"/>
  <use href="#cube" x="128" y="120"/>

  <g stroke="#f7b500" stroke-width="4" stroke-linecap="round">
    <path d="M88 84 v16 M80 92 h16"/>
    <path d="M110 58 v10 M105 63 h10"/>
    <path d="M154 66 v10 M149 71 h10"/>
  </g>

  <ellipse cx="192" cy="92" rx="28" ry="22" fill="#ffffff" stroke="#2f6fd0" stroke-width="5"/>
  <circle cx="182" cy="89" r="4.5" fill="#2f6fd0"/>
  <circle cx="203" cy="89" r="4.5" fill="#2f6fd0"/>
  <path d="M186 100 Q192.5 105 199 100" fill="none" stroke="#2f6fd0" stroke-width="3" stroke-linecap="round"/>
</svg>
