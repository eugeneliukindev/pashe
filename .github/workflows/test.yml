name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:  # the release runs every check before it publishes
  schedule:
    - cron: '17 4 * * 1'  # Mondays: the newest releases of the dependencies, with no commit here

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.15'  # of the checks that run once: the newest Python pashe supports

# Every job starts at once: the checks of the code run once each, the tests once per Python and server.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing pushes back to the repository
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install just
        run: uv tool install rust-just
      - name: Install dependencies
        run: just install --locked --python ${{ env.PYTHON_VERSION }}
      - name: Run the linters
        run: just lint

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing pushes back to the repository
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install just
        run: uv tool install rust-just
      - name: Install dependencies
        run: just install --locked --python ${{ env.PYTHON_VERSION }}
      - name: Run the type checkers
        run: just types

  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing pushes back to the repository
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install just
        run: uv tool install rust-just
      - name: Install dependencies
        run: just install --locked --python ${{ env.PYTHON_VERSION }}
      - name: Check the lock and look for vulnerabilities
        run: just deps

  examples:
    name: Examples of the docstrings and the docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing pushes back to the repository
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install just
        run: uv tool install rust-just
      - name: Install dependencies
        run: just install --locked --python ${{ env.PYTHON_VERSION }}
      - name: Run the examples of the docstrings
        run: just doctest
      - name: Run the examples of the docs
        run: just docs-check

  test:
    name: Tests, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing pushes back to the repository
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install just
        run: uv tool install rust-just
      - name: Install dependencies
        run: just install --locked --python ${{ matrix.python-version }}
      - name: Run the tests
        run: just test

  sessions:
    # the sessions of noxfile.py, each a job of nox below: the lowest and the highest versions of the
    # dependencies on every Python, every server, and the Pythons without the GIL
    name: Sessions of nox
    runs-on: ubuntu-latest
    outputs:
      sessions: ${{ steps.list.outputs.sessions }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing pushes back to the repository
      - uses: astral-sh/setup-uv@v10.4.0
      - name: List the sessions
        id: list
        run: echo "sessions=$(uv run --locked --only-group test nox -l --json -s lowest highest servers free_threaded | jq -c 'map({session, python, tags})')" >> "$GITHUB_OUTPUT"

  nox:
    name: ${{ matrix.session }}
    needs: sessions
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(matrix.tags, 'experimental') }}  # a session tagged so reports, not blocks
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.sessions.outputs.sessions) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing pushes back to the repository
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install nox
        run: uv sync --locked --only-group test  # nox makes the environment of the run itself
      - name: Run the session
        run: uv run nox -s "$SESSION"
        env:
          SESSION: ${{ matrix.session }}  # through the environment: it is the output of another job

  check:
    # The one check a branch protection asks for: it passes when every job above passed, the
    # experimental cells of the tests aside.
    name: All checks passed
    if: always()
    needs: [lint, types, deps, examples, test, sessions, nox]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
